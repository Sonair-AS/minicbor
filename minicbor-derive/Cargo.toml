[package]
name          = "minicbor-derive"
version       = "0.19.4"
authors       = ["Toralf Wittner <tw@dtex.org>"]
license       = "BlueOak-1.0.0"
edition       = "2024"
description   = "Derive minicbor `Decode` and `Encode` traits."
repository    = "https://github.com/twittner/minicbor"
keywords      = ["cbor", "minicbor", "serialization", "encoding", "no_std"]
categories    = ["encoding"]

[lib]
proc-macro = true

[features]
alloc = [] # unused
std   = [] # unused

[dependencies]
proc-macro2 = { git = "https://github.com/Sonair-AS/proc-macro2.git", branch = "certified_subset" }
quote       = { git = "https://github.com/Sonair-AS/quote.git", branch = "certified_subset" }
syn         = { git = "https://github.com/Sonair-AS/syn.git", branch = "certified_subset", features = ["derive", "extra-traits", "visit"] }

[dev-dependencies]
minicbor = { path = "../minicbor", features = ["std", "derive"] }
