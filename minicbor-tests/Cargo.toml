[package]
publish     = false
name        = "minicbor-tests"
version     = "0.1.0"
authors     = ["Toralf Wittner <tw@dtex.org>"]
license     = "BlueOak-1.0.0"
edition     = "2024"
description = "minicbor test suite"

[features]
alloc  = ["minicbor/alloc"]
std    = ["alloc", "minicbor/std", "minicbor/derive"]
derive = ["alloc", "minicbor/derive"]
certified_subset = ["minicbor/certified_subset"]

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
minicbor  = { path = "../minicbor" }
rand      = "0.9.0"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[dev-dependencies]
hex        = "0.4.2"
quickcheck = "1.0.1"
